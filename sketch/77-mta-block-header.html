<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Nothing to see here...</title>
		<style>
			:root {
				color-scheme: light;
				--black: #111;
				--blue: #0039a6;
			}

			* { box-sizing: border-box; }
			html, body { min-height: 100%; }
			body { margin: 0; color: var(--black); background: #fff; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
			main { width: min(64rem, calc(100% - 3rem)); margin: 0 auto; padding-top: clamp(2rem, 6vh, 4rem); }
			.masthead { display: grid; grid-template-columns: clamp(3.5rem, 8vw, 5rem) 1fr; align-items: center; gap: clamp(0.75rem, 2vw, 1.25rem); }
			.marker { height: 1rem; background: var(--black); }
			.header-rule { border-top: 1px solid var(--black); }
			.message { margin-top: clamp(6rem, 16vh, 11rem); padding-bottom: clamp(1.25rem, 3vw, 2rem); border-bottom: 0.5rem solid var(--black); }
			h1 { margin: 0; font-size: clamp(4rem, 11vw, 8.5rem); font-weight: 700; letter-spacing: -0.065em; line-height: 0.84; }
			.line { display: block; }
			.dots { color: var(--blue); }

			@media (max-width: 32rem) {
				main { width: calc(100% - 2rem); }
				.message { margin-top: 18vh; border-bottom-width: 0.4rem; }
			}
		</style>
	</head>
	<body>
		<main>
			<header class="masthead" aria-hidden="true">
				<span class="marker"></span>
				<span class="header-rule"></span>
			</header>
			<section class="message" aria-labelledby="page-title">
				<h1 id="page-title">
					<span class="line">Nothing to</span>
					<span class="line">see here<span class="dots">...</span></span>
				</h1>
			</section>
		</main>
	</body>
</html>
