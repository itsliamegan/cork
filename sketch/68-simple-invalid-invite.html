<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Cork - Simplified invalid invite</title>
		<style>
			:root{--canvas:#fff;--fg:#111;--muted:#626262;--surface:#f1f1f1;--control:#fff;--line:#999;--line-dim:#d5d5d5;--blue:#0f61a9;--focus:rgb(15 97 169 / 25%)}
			*{box-sizing:border-box}body{margin:0;color:var(--fg);background:var(--canvas);font:14px/1.35 "Helvetica Neue",Helvetica,Arial,sans-serif}.site-header{border-bottom:1px solid var(--line-dim);background:var(--surface)}.site-header-inner{display:flex;align-items:center;width:min(35rem,93.5vw);height:2.8rem;margin:auto}.brand{color:var(--fg);font-size:1.15rem;font-weight:700;text-decoration:none}
			main{width:min(22rem,93.5vw);margin:6rem auto 2rem}.page-header{margin-bottom:1rem;padding-bottom:.6rem;border-bottom:3px solid var(--fg)}h1{margin:0;font-size:1.45rem;line-height:1.15}.frame{overflow:hidden;border:1px solid var(--line);border-radius:3px;background:var(--canvas)}.message{padding:.8rem .65rem}.message strong{display:block;margin-bottom:.2rem}.message p{margin:0;color:var(--muted);font-size:.75rem}.actions{display:flex;justify-content:flex-end;padding:.55rem .65rem;border-top:1px solid var(--line-dim)}.button{display:inline-flex;align-items:center;justify-content:center;padding:.34rem .65rem;border:1px solid var(--line);border-radius:3px;color:var(--fg);background:var(--control);font-weight:600;text-decoration:none}.button:hover{background:var(--surface)}.button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
			@media(max-width:24rem){main{margin-top:3.5rem}}
			@media(prefers-color-scheme:dark){:root{--canvas:#151515;--fg:#f1f1f1;--muted:#aaa;--surface:#242424;--control:#1c1c1c;--line:#707070;--line-dim:#3e3e3e;--blue:#70afe4;--focus:rgb(112 175 228 / 30%)}}
		</style>
	</head>
	<body>
		<header class="site-header"><div class="site-header-inner"><a class="brand" href="#">Cork</a></div></header>
		<main>
			<header class="page-header"><h1>Invite unavailable</h1></header>
			<section class="frame">
				<div class="message"><p>This link has expired, has already been used, or isn’t valid.</p></div>
				<footer class="actions"><a class="button" href="#">Go to sign in</a></footer>
			</section>
		</main>
	</body>
</html>
