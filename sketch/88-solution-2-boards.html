<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Cork - Boards - Solution 2</title>
		<style>
			:root { --canvas:#fff; --foreground:#111; --muted:#626262; --surface:#f1f1f1; --soft:#fafafa; --border:#999; --divider:#d5d5d5; --blue:#0f61a9; --focus:rgb(15 97 169 / 25%); }
			@media(prefers-color-scheme:dark){:root{--canvas:#151515;--foreground:#f1f1f1;--muted:#aaa;--surface:#242424;--soft:#1c1c1c;--border:#707070;--divider:#3e3e3e;--blue:#68afe9;--focus:rgb(104 175 233 / 30%);}}
			*{box-sizing:border-box} body{margin:0;color:var(--foreground);background:var(--canvas);font:14px/1.35 "Helvetica Neue",Helvetica,Arial,sans-serif} a{color:var(--blue);text-underline-offset:2px}.site-header{border-bottom:1px solid var(--border);background:var(--surface)}
			.site-header-inner{display:flex;align-items:stretch;width:100%;max-width:40rem;height:2.8rem;margin:auto;padding:0 .6rem}.brand,.site-nav a,.account{display:flex;align-items:center;color:var(--foreground);text-decoration:none}.brand{font-size:1.15rem;font-weight:700}.site-nav{display:flex;margin-left:1.2rem}.site-nav a{padding:0 .65rem;border-bottom:3px solid transparent;font-weight:600}.site-nav a[aria-current="page"]{border-color:var(--blue)}.account{gap:.55rem;margin-left:auto;color:var(--muted);font-size:.78rem}.account span{color:var(--foreground);font-weight:600}
			main{width:100%;max-width:40rem;margin:1.35rem auto 3rem;padding:0 .6rem}.page-tools{display:flex;justify-content:flex-end;margin-bottom:1rem}.button{display:inline-block;padding:.34rem .65rem;border:1px solid #0b477c;border-radius:3px;color:#fff;background:#0f61a9;font-weight:600;text-decoration:none}.group+.group{margin-top:1.4rem}.section-title{margin:0 0 .4rem;font-size:.85rem}.list{overflow:hidden;border:1px solid var(--border);border-radius:3px}.board{display:grid;grid-template-columns:minmax(0,1fr) minmax(9rem,auto) auto;align-items:center;gap:.75rem;min-height:3.25rem;padding:.55rem .65rem}.board+.board{border-top:1px solid var(--divider)}.board:hover{background:var(--soft)}.board-title{color:var(--foreground);font-weight:600}.members,.count{color:var(--muted);font-size:.72rem}.count{text-align:right;white-space:nowrap}.new{color:var(--blue)} a:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
			@media(max-width:32rem){.account span{display:none}.site-nav{margin-left:.6rem}.site-nav a{padding:0 .45rem}.board{grid-template-columns:minmax(0,1fr) auto}.members{grid-column:1/-1;grid-row:2}.count{grid-column:2;grid-row:1}}
		</style>
	</head>
	<body>
		<header class="site-header"><div class="site-header-inner"><a class="brand" href="#">Cork</a><nav class="site-nav" aria-label="Main navigation"><a href="#">Home</a><a href="#" aria-current="page">Boards</a><a href="#">Pins</a></nav><a class="account" href="#"><span>Liam</span> Settings</a></div></header>
		<main>
			<div class="page-tools"><a class="button" href="#">New board</a></div>
			<section class="group" aria-labelledby="shared-heading"><h1 class="section-title" id="shared-heading">Shared</h1><div class="list">
				<div class="board"><a class="board-title" href="#">Seminar reading</a><span class="members">Liam, Nadia, Theo</span><span class="count new">3 new</span></div>
				<div class="board"><a class="board-title" href="#">Links for Liam</a><span class="members">Liam, Theo</span><span class="count">19 pins</span></div>
				<div class="board"><a class="board-title" href="#">Sources for the essay</a><span class="members">Liam, Marguerite</span><span class="count">8 pins</span></div>
			</div></section>
			<section class="group" aria-labelledby="private-heading"><h2 class="section-title" id="private-heading">Private</h2><div class="list">
				<div class="board"><a class="board-title" href="#">Personal computing</a><span class="members">Only you</span><span class="count">12 pins</span></div>
				<div class="board"><a class="board-title" href="#">To read</a><span class="members">Only you</span><span class="count">31 pins</span></div>
			</div></section>
		</main>
	</body>
</html>
