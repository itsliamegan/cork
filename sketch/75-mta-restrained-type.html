<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Nothing to see here...</title>
		<style>
			:root {
				color-scheme: light;
				--black: #111;
				--blue: #0039a6;
			}

			* { box-sizing: border-box; }
			html, body { min-height: 100%; }
			body { margin: 0; color: var(--black); background: #fff; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
			main { width: min(64rem, calc(100% - 3rem)); margin: 0 auto; padding-top: clamp(7rem, 26vh, 15rem); }
			.message { padding-bottom: clamp(1.25rem, 3vw, 2rem); border-bottom: 0.5rem solid var(--black); }
			h1 { margin: 0; font-size: clamp(4rem, 11vw, 8.5rem); font-weight: 700; letter-spacing: -0.065em; line-height: 0.84; }
			.line { display: block; }
			.dots { color: var(--blue); }

			@media (max-width: 32rem) {
				main { width: calc(100% - 2rem); padding-top: 22vh; }
				.message { border-bottom-width: 0.4rem; }
			}
		</style>
	</head>
	<body>
		<main>
			<section class="message" aria-labelledby="page-title">
				<h1 id="page-title">
					<span class="line">Nothing to</span>
					<span class="line">see here<span class="dots">...</span></span>
				</h1>
			</section>
		</main>
	</body>
</html>
