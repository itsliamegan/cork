<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Nothing to see here...</title>
		<style>
			:root {
				--black: #111;
				--blue: #0039a6;
			}

			* { box-sizing: border-box; }
			html, body { min-height: 100%; }
			body { margin: 0; color: var(--black); background: #fff; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }

			main { display: grid; align-items: center; width: min(100% - 3rem, 76rem); min-height: 100vh; margin: 0 auto; padding: clamp(2rem, 6vw, 5rem) 0; border-bottom: 0.45rem solid var(--black); }
			.message { padding-left: clamp(0rem, 15vw, 12rem); }
			h1 { max-width: 9ch; margin: -0.08em 0 0; font-size: clamp(3.5rem, 10vw, 8.5rem); font-weight: 700; letter-spacing: -0.06em; line-height: 0.88; }
			.dots { color: var(--blue); }

			@media (max-width: 38rem) {
				main { width: min(100% - 2rem, 76rem); }
			}
		</style>
	</head>
	<body>
		<main>
			<section class="message" aria-labelledby="page-title">
				<h1 id="page-title">Nothing to see here<span class="dots">...</span></h1>
			</section>
		</main>
	</body>
</html>
