<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Cork — Console New Pin</title>
		<style>
			:root {
				--bg: #0b0b0c;
				--panel: #101012;
				--field: #08080a;
				--fg: #dcdcd8;
				--muted: #76767e;
				--line: #24242a;
				--line-strong: #34343c;
				--accent: #e0a33e;
				--danger: #d97070;
			}

			* { box-sizing: border-box; }
			body { margin: 0; color: var(--fg); background: var(--bg); font: 13px/1.5 ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
			a { color: inherit; text-decoration: none; }
			input, select, button { font: inherit; }

			.site-header { border-bottom: 1px solid var(--line); }
			.site-header-inner { display: flex; align-items: center; gap: 1.5rem; max-width: 44rem; height: 2.6rem; margin: auto; padding: 0 1rem; }
			.brand { font-weight: 700; letter-spacing: -0.02em; }
			.brand::after { content: "_"; color: var(--accent); }
			.site-nav { display: flex; gap: 1.1rem; font-size: 0.85rem; color: var(--muted); }
			.site-nav a[aria-current] { color: var(--fg); }
			.site-nav a[aria-current]::before { content: "› "; color: var(--accent); }
			.settings { margin-left: auto; color: var(--muted); font-size: 0.85rem; }

			main { max-width: 44rem; margin: 2rem auto; padding: 0 1rem; }
			.path { margin-bottom: 0.35rem; color: var(--muted); font-size: 0.8rem; }
			.page-header { display: flex; align-items: baseline; gap: 0.8rem; margin-bottom: 1.1rem; }
			h1 { margin: 0; font-size: 0.95rem; font-weight: 700; }
			h1::before { content: "/"; margin-right: 0.15rem; color: var(--accent); }

			.panel { border: 1px solid var(--line); border-radius: 3px; background: var(--panel); }
			.panel-header { display: flex; align-items: center; padding: 0.35rem 0.75rem; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 0.75rem; letter-spacing: 0.06em; text-transform: uppercase; }

			.field { display: grid; grid-template-columns: 6rem minmax(0, 1fr); align-items: center; gap: 0.75rem; padding: 0.5rem 0.75rem; }
			.field + .field { border-top: 1px solid var(--line); }
			.field label { color: var(--muted); font-size: 0.8rem; }
			.field label::after { content: ":"; }
			input, select { width: 100%; padding: 0.3rem 0.45rem; border: 1px solid var(--line-strong); border-radius: 2px; color: var(--fg); background: var(--field); }
			input:focus, select:focus { border-color: var(--accent); outline: none; }
			.help { grid-column: 2; margin: -0.15rem 0 0; color: var(--muted); font-size: 0.75rem; }

			.form-actions { display: flex; align-items: center; gap: 0.4rem; padding: 0.5rem 0.75rem; border-top: 1px solid var(--line); }
			.form-actions .hint { margin-right: auto; color: var(--muted); font-size: 0.75rem; }
			.action { padding: 0.2rem 0.6rem; border: 1px solid var(--line-strong); border-radius: 2px; color: var(--muted); background: none; font-size: 0.8rem; cursor: pointer; }
			.action:hover { border-color: var(--accent); color: var(--accent); }
			.action-primary { border-color: var(--accent); color: var(--accent); }
			.action-primary:hover { color: var(--bg); background: var(--accent); }

			kbd { padding: 0.05rem 0.3rem; border: 1px solid var(--line-strong); border-radius: 2px; font: inherit; }

			@media (max-width: 30rem) {
				.settings { display: none; }
				.field { grid-template-columns: 1fr; gap: 0.2rem; }
				.help { grid-column: 1; }
			}
		</style>
	</head>
	<body>
		<header class="site-header">
			<div class="site-header-inner">
				<a class="brand" href="#">cork</a>
				<nav class="site-nav" aria-label="Main navigation"><a href="#" aria-current="page">boards</a><a href="#">pins</a></nav>
				<a class="settings" href="#">liam@cork</a>
			</div>
		</header>
		<main>
			<div class="path"><a href="#">boards</a> / <a href="#">personal-computing</a> / new</div>
			<header class="page-header"><h1>new pin</h1></header>

			<form class="panel">
				<header class="panel-header">details</header>
				<div class="field"><label for="title">title</label><input id="title" name="title" value="Augmenting Human Intellect" autofocus></div>
				<div class="field"><label for="url">url</label><input id="url" name="url" type="url" value="https://dougengelbart.org/pubs/papers/AugmentingHumanIntellect.pdf"></div>
				<div class="field">
					<label for="board">board</label>
					<select id="board" name="board"><option>personal-computing</option><option>labor-history</option><option>recipes</option></select>
				</div>
				<footer class="form-actions">
					<span class="hint"><kbd>⌘↵</kbd> save · <kbd>esc</kbd> cancel</span>
					<a class="action" href="#">cancel</a>
					<button class="action action-primary" type="submit">save pin</button>
				</footer>
			</form>
		</main>
	</body>
</html>
