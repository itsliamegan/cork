<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Cork — Delete Pin</title>
		<style>
			:root {
				--fg: #111;
				--muted: #626262;
				--surface: #f5f5f5;
				--line: #999;
				--line-dim: #d5d5d5;
				--blue: #0f61a9;
				--danger: #9b1c1c;
			}

			* { box-sizing: border-box; }
			body { margin: 0; color: var(--fg); background: #fff; font: 14px/1.45 "Helvetica Neue", Helvetica, Arial, sans-serif; }
			a { color: var(--blue); text-underline-offset: 2px; }
			button { font: inherit; }

			.site-header { color: #fff; background: var(--fg); }
			.site-header-inner { display: flex; align-items: stretch; max-width: 42rem; height: 3.2rem; margin: auto; padding: 0 1rem; }
			.brand, .site-nav a, .settings { display: flex; align-items: center; color: #fff; }
			.brand { font-size: 1.25rem; font-weight: 700; text-decoration: none; }
			.site-nav { display: flex; margin-left: 1.5rem; }
			.site-nav a { padding: 0 0.8rem; border-bottom: 4px solid var(--blue); font-weight: 600; text-decoration: none; }
			.settings { margin-left: auto; color: #ddd; font-size: 0.8rem; }

			main { max-width: 42rem; margin: 2rem auto; padding: 0 1rem; }
			.breadcrumb { margin-bottom: 0.75rem; color: var(--muted); font-size: 0.8rem; }
			.page-header { margin-bottom: 1.5rem; padding-bottom: 0.9rem; border-bottom: 3px solid var(--fg); }
			h1 { margin: 0; font-size: 1.7rem; }
			.stack { overflow: hidden; border: 1px solid var(--line); border-radius: 4px; }
			.row { display: flex; align-items: center; padding: 0.8rem; }
			.row + .row { border-top: 1px solid var(--line-dim); }
			.pin-title { color: var(--fg); font-weight: 600; }
			.row .button { margin-left: auto; }

			.button { padding: 0.42rem 0.75rem; border: 1px solid #888; border-radius: 3px; color: var(--fg); background: var(--surface); font-weight: 600; cursor: pointer; }
			.button-danger { border-color: #751616; color: #fff; background: var(--danger); }

			dialog { width: min(24rem, calc(100% - 2rem)); padding: 0; border: 2px solid var(--fg); border-radius: 4px; color: var(--fg); background: #fff; }
			dialog::backdrop { background: rgb(0 0 0 / 38%); }
			.dialog-title { margin: 0; padding: 0.75rem 0.85rem; border-bottom: 2px solid var(--fg); font-size: 1.05rem; }
			.dialog-body { padding: 1rem 0.85rem; }
			.dialog-body p { margin: 0; }
			.dialog-actions { display: flex; justify-content: flex-end; gap: 0.6rem; padding: 0.75rem 0.85rem; border-top: 1px solid var(--line); }
		</style>
	</head>
	<body>
		<header class="site-header">
			<div class="site-header-inner">
				<a class="brand" href="#">Cork</a>
				<nav class="site-nav" aria-label="Main navigation"><a href="#" aria-current="page">Boards</a></nav>
				<a class="settings" href="#">Settings</a>
			</div>
		</header>
		<main>
			<div class="breadcrumb"><a href="#">Boards</a> / Personal Computing</div>
			<header class="page-header"><h1>Personal Computing</h1></header>
			<div class="stack">
				<div class="row"><a class="pin-title" href="#">Augmenting Human Intellect</a><button class="button" type="button">•••</button></div>
				<div class="row"><a class="pin-title" href="#">The Mother of All Demos</a><button class="button" type="button">•••</button></div>
			</div>
		</main>

		<dialog aria-labelledby="dialog-title">
			<h2 class="dialog-title" id="dialog-title">Delete pin?</h2>
			<div class="dialog-body"><p>Augmenting Human Intellect will be permanently removed.</p></div>
			<footer class="dialog-actions">
				<button class="button" type="button">Cancel</button>
				<button class="button button-danger" type="button">Delete pin</button>
			</footer>
		</dialog>
		<script>document.querySelector("dialog").showModal()</script>
	</body>
</html>
