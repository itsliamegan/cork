<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Nothing to see here...</title>
		<style>
			:root {
				color-scheme: light;
				--black: #111;
				--blue: #276fbe;
			}

			* { box-sizing: border-box; }
			html, body { min-height: 100%; }
			body { margin: 0; background: #fff; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
			main { width: min(68rem, calc(100% - 3rem)); margin: 0 auto; padding-top: clamp(5rem, 16vh, 10rem); }
			.sign { width: min(39rem, 100%); margin-left: clamp(0rem, 8vw, 6rem); padding: clamp(2rem, 5vw, 3.5rem); background: var(--black); color: #fff; }
			h1 { margin: 0; font-size: clamp(4.5rem, 11vw, 7.5rem); font-weight: 700; letter-spacing: -0.065em; line-height: 0.78; }
			.line { display: block; }
			.dots { color: var(--blue); }

			@media (max-width: 44rem) {
				.sign { margin-left: 0; }
			}

			@media (max-width: 32rem) {
				main { width: calc(100% - 2rem); padding-top: 13vh; }
			}
		</style>
	</head>
	<body>
		<main>
			<section class="sign" aria-labelledby="page-title">
				<h1 id="page-title">
					<span class="line">Nothing</span>
					<span class="line">to see</span>
					<span class="line">here<span class="dots">...</span></span>
				</h1>
			</section>
		</main>
	</body>
</html>
