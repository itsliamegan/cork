<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width,initial-scale=1">
		<title>Cork - Board reordering</title>

		<!-- Use the app's actual foundations and components. -->
		<link rel="stylesheet" type="text/css" href="../app/assets/styles/prelude.css">
		<link rel="stylesheet" type="text/css" href="../app/assets/styles/theme.css">
		<link rel="stylesheet" type="text/css" href="../app/assets/styles/main.css">

		<style>
			/* Visual spike only: these classes force the proposed drag states. */
			.board-reorder-handle {
				flex: none;
				width: var(--space-4);
				margin-inline-end: calc(-1 * var(--space-3));

				font-size: var(--font-size-meta);
				line-height: 1;
				cursor: grab;

				color: var(--color-text-muted);
				opacity: 0;
				transition: opacity 100ms ease-out;
			}

			.frame-item--reorderable:hover .board-reorder-handle,
			.frame-item--reorderable:focus-within .board-reorder-handle {
				opacity: 0.7;
			}

			.frame-item--dragging {
				position: relative;
				z-index: 1;
				outline: var(--rule-panel) solid var(--color-border-strong);
				outline-offset: calc(-1 * var(--rule-panel));
				background-color: var(--color-surface);
				opacity: 0.82;
				transform: translate(var(--space-3), var(--space-2));
			}

			.frame-item--dragging .board-reorder-handle {
				cursor: grabbing;
				color: var(--color-text);
				opacity: 1;
			}

			@media (hover: none) {
				.board-reorder-handle {
					opacity: 0.55;
				}
			}

			.board-drop-target {
				position: relative;
				height: var(--space-5);
				margin-block: calc(-1 * var(--space-2));
				pointer-events: none;
			}

			.board-drop-target::before {
				position: absolute;
				inset-block-start: 50%;
				inset-inline: var(--space-3);
				height: var(--rule-page);
				background-color: var(--color-action);
				content: "";
				transform: translateY(-50%);
			}

			.board-drop-target::after {
				position: absolute;
				inset-block-start: 50%;
				inset-inline-start: var(--space-3);
				width: 7px;
				height: 7px;
				border-radius: 50%;
				background-color: var(--color-action);
				content: "";
				transform: translate(-2px, -50%);
			}
		</style>
	</head>

	<body>
		<header id="site-header">
			<h1 id="site-title">Cork</h1>

			<nav id="site-nav">
				<a class="site-nav-link site-nav-link--active" href="#">Boards</a>
			</nav>

			<section id="site-actions">
				<span class="site-identity">Liam E.</span>
				<span class="site-action-separator">/</span>
				<a class="site-action" href="#">Settings</a>
			</section>
		</header>

		<main id="page">
			<header id="page-header">
				<h2 id="page-title">Boards</h2>

				<section id="page-actions">
					<a class="button button--action" href="#">New board</a>
				</section>
			</header>

			<section class="frame">
				<header class="frame-header">
					<h3 class="frame-title">Private boards</h3>
				</header>

				<ol class="frame-items">
					<li class="frame-item frame-item--reorderable">
						<article class="board">
							<span class="board-reorder-handle" title="Drag to reorder">⠿</span>
							<section class="board-details">
								<a class="board-link" href="#"><h3 class="board-title">Example</h3></a>
								<time class="board-date" datetime="2026-09-06T18:46:57.708845+00:00">Sep 6, 2026</time>
							</section>
							<section class="board-actions">
								<button class="button button--icon" type="button">&#8942;</button>
							</section>
						</article>
					</li>
				</ol>

				<header class="frame-header">
					<h3 class="frame-title">Shared boards</h3>
				</header>

				<ol class="frame-items">
					<li class="frame-item frame-item--reorderable frame-item--dragging">
						<article class="board">
							<span class="board-reorder-handle" title="Dragging">⠿</span>
							<section class="board-details">
								<a class="board-link" href="#"><h3 class="board-title">Personal Computing</h3></a>
								<time class="board-date" datetime="2026-09-03T23:36:16.337150+00:00">Sep 3, 2026</time>
							</section>
							<section class="board-actions">
								<button class="button button--icon" type="button">&#8942;</button>
							</section>
						</article>
					</li>

					<li class="frame-item frame-item--reorderable">
						<article class="board">
							<span class="board-reorder-handle" title="Drag to reorder">⠿</span>
							<section class="board-details">
								<a class="board-link" href="#"><h3 class="board-title">Labor History</h3></a>
								<time class="board-date" datetime="2026-09-04T02:45:40.780311+00:00">Sep 4, 2026</time>
							</section>
						</article>
					</li>

					<li class="board-drop-target" aria-hidden="true"></li>
				</ol>
			</section>
		</main>
	</body>
</html>
