<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Cork - Tight boards - Solution 1</title>
		<style>
			:root{--canvas:#fff;--foreground:#111;--muted:#626262;--surface:#f1f1f1;--soft:#fafafa;--border:#999;--divider:#d5d5d5;--blue:#0f61a9;--focus:rgb(15 97 169 / 25%)}@media(prefers-color-scheme:dark){:root{--canvas:#151515;--foreground:#f1f1f1;--muted:#aaa;--surface:#242424;--soft:#1c1c1c;--border:#707070;--divider:#3e3e3e;--blue:#68afe9;--focus:rgb(104 175 233 / 30%)}}
			*{box-sizing:border-box}body{margin:0;color:var(--foreground);background:var(--canvas);font:14px/1.35 "Helvetica Neue",Helvetica,Arial,sans-serif}a{color:var(--blue);text-underline-offset:2px}.site-header{border-bottom:1px solid var(--border);background:var(--surface)}.site-header-inner{display:flex;align-items:stretch;max-width:35rem;height:2.8rem;margin:auto;padding:0 .6rem}.brand,.site-nav a,.settings{display:flex;align-items:center;color:var(--foreground);text-decoration:none}.brand{font-size:1.15rem;font-weight:700}.site-nav{display:flex;margin-left:1.2rem}.site-nav a{padding:0 .55rem;border-bottom:3px solid transparent;font-weight:600}.site-nav a[aria-current="page"]{border-color:var(--blue)}.settings{margin-left:auto;color:var(--muted);font-size:.78rem}
			main{max-width:35rem;margin:1.35rem auto 3rem;padding:0 .6rem}.page-header{display:flex;align-items:center;gap:.75rem;margin-bottom:1rem;padding-bottom:.6rem;border-bottom:3px solid var(--foreground)}h1{margin:0;font-size:1.45rem;line-height:1.15}.button{display:inline-block;margin-left:auto;padding:.34rem .65rem;border:1px solid #0b477c;border-radius:3px;color:#fff;background:#0f61a9;font-weight:600;text-decoration:none}.frame{overflow:hidden;border:1px solid var(--border);border-radius:3px}.frame-header{display:flex;align-items:baseline;min-height:2rem;padding:.35rem .65rem;border-bottom:2px solid var(--foreground);background:var(--surface)}.frame-header:not(:first-child){border-top:1px solid var(--border)}.frame-header h2{margin:0;font-size:.85rem}.frame-meta{margin-left:auto;color:var(--muted);font-size:.7rem}.board{display:grid;grid-template-columns:minmax(0,1fr) minmax(8rem,auto) auto;align-items:center;gap:.7rem;min-height:2.55rem;padding:.3rem .65rem}.board+.board{border-top:1px solid var(--divider)}.board:hover{background:var(--soft)}.board-title{color:var(--foreground);font-weight:600}.members,.count{color:var(--muted);font-size:.72rem}.count{text-align:right;white-space:nowrap}.new{color:var(--blue)}a:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
			@media(max-width:29rem){.settings{display:none}.site-nav{margin-left:.55rem}.site-nav a{padding:0 .4rem}.board{grid-template-columns:minmax(0,1fr) auto}.members{grid-column:1/-1;grid-row:2}.count{grid-column:2;grid-row:1}}
		</style>
	</head>
	<body>
		<header class="site-header"><div class="site-header-inner"><a class="brand" href="#">Cork</a><nav class="site-nav" aria-label="Main navigation"><a href="#">Home</a><a href="#" aria-current="page">Boards</a><a href="#">Pins</a></nav><a class="settings" href="#">Settings</a></div></header>
		<main>
			<header class="page-header"><h1>Boards</h1><a class="button" href="#">New board</a></header>
			<div class="frame">
				<header class="frame-header"><h2>Shared</h2><span class="frame-meta">3 boards</span></header>
				<div class="board"><a class="board-title" href="#">Seminar reading</a><span class="members">Liam, Nadia, Theo</span><span class="count new">3 new</span></div>
				<div class="board"><a class="board-title" href="#">Links for Liam</a><span class="members">Liam, Theo</span><span class="count">19 pins</span></div>
				<div class="board"><a class="board-title" href="#">Sources for the essay</a><span class="members">Liam, Marguerite</span><span class="count">8 pins</span></div>
				<header class="frame-header"><h2>Private</h2><span class="frame-meta">2 boards</span></header>
				<div class="board"><a class="board-title" href="#">Personal computing</a><span class="members">Only you</span><span class="count">12 pins</span></div>
				<div class="board"><a class="board-title" href="#">To read</a><span class="members">Only you</span><span class="count">31 pins</span></div>
			</div>
		</main>
	</body>
</html>
