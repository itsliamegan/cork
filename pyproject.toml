[project]
name = "cork"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
	"gunicorn>=26.2.0",
	"helios",
	"markupsafe>=3.0.3",
]

[dependency-groups]
backup = [
	"boto3>=1.35",
	"luna",
]
dev = [
	"luna",
	"ruff>=0.17.1",
	"ty>=0.0.89",
]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["backup", "dev"]
package = true

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[tool.uv.sources]
helios = { git = "https://github.com/itsliamegan/helios", branch = "main", subdirectory = "packages/framework" }
luna = { git = "https://github.com/itsliamegan/luna", branch = "main" }

[tool.ty.src]
include = ["**", "bin/helios"]
