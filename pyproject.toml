[project]
name = "cork"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "gunicorn>=26.2.0",
    "helios",
]

[project.scripts]
serve = "app.main:main"

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.uv.build-backend]
module-name = ["app", "lib"]
module-root = ""

[tool.uv.sources]
helios = { path = "../helios", editable = true }
luna = { path = "../luna", editable = true }

[tool.ruff]
target-version = "py314"

[tool.ruff.format]
indent-style = "tab"
nested-string-quote-style = "preferred"
quote-style = "double"

[tool.ruff.lint.isort]
case-sensitive = true
known-first-party = ["app", "lib"]
force-sort-within-sections = true
order-by-type = false

[dependency-groups]
backup = [
    "boto3>=1.35",
    "luna",
]
dev = [
    "luna",
    "ruff>=0.16.6",
    "ty>=0.0.81",
]
