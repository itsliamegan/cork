[tools]
uv = "latest"

[settings]
python.uv_venv_auto = "create|source"

[tasks]
serve = "bin/helios serve"
migrate = "bin/migrate.py apply"
"migrate:status" = "bin/migrate.py status"
test = [
	"bin/helios assets:compile",
	"uv run luna test",
]
lint = [
	"ruff format",
	"ruff check --fix",
]
check = "ty check"
