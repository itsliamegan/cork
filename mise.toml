[tools]
uv = "latest"

[settings]
python.uv_venv_auto = "create|source"

[tasks]
serve = "podman run --name cork --replace --systemd always --volume ./data:/var/lib/cork --publish 4000:80 cork"
migrate = "podman exec --user cork --workdir /srv/cork cork .venv/bin/python bin/migrate.py apply"
"migrate:status" = "podman exec --user cork --workdir /srv/cork cork .venv/bin/python bin/migrate.py status"
test = "uv run -m luna.test.runner"
lint = [
	"ruff format",
	"ruff check --fix",
	"ty check",
]
