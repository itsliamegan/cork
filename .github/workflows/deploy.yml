name: Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  check:
    uses: ./.github/workflows/check.yml

  deploy:
    needs: check
    runs-on: ubuntu-latest
    env:
      DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}

    steps:
      - name: "Set up SSH key"
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: "Deploy to VPS"
        run: |
          ssh \
          -o StrictHostKeyChecking=no \
          -p "$DEPLOY_PORT" \
          "$DEPLOY_USER@$DEPLOY_HOST" '
            set -e

            cd /srv/cork
            git pull
            uv sync --locked --no-default-groups --group backup
            sudo systemctl stop cork.socket cork.service
            sudo systemctl start cork-backup.service
            sudo -u cork /srv/cork/.venv/bin/python bin/migrate.py apply
            sudo systemctl start cork.socket cork.service
          '
