<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width,initial-scale=1">
		{% block turbo_control %}
		<meta name="turbo-visit-control" content="reload">
		{% endblock %}
		{% block metadata %}{% endblock %}

		<title>{% block title %}Cork{% endblock %}</title>

		<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
		<link rel="icon" type="image/png" sizes="192x192" href="/static/favicon.png">
		<link rel="icon" href="/static/favicon.ico">
		<link rel="apple-touch-icon" sizes="180x180" href="/static/apple.png">

		<link rel="stylesheet" type="text/css" href="/static/styles/prelude.css">
		<link rel="stylesheet" type="text/css" href="/static/styles/theme.css">
		<link rel="stylesheet" type="text/css" href="/static/styles/main.css">

		{% block scripts %}{% endblock %}
	</head>

	<body>
		<header id="site-header">
			<svg id="site-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
				<rect width="100" height="100" rx="10" fill="var(--color-text, #111111)"/>
				<line x1="35" y1="67" x2="69" y2="27" stroke="var(--color-surface, #f1f1f1)" stroke-width="12" stroke-linecap="square"/>
				<rect x="20" y="52" width="30" height="30" rx="3" fill="var(--color-surface, #f1f1f1)"/>
				<rect x="58" y="16" width="22" height="22" rx="3" fill="var(--color-surface, #f1f1f1)"/>
			</svg>

			{% block header %}
			{% endblock %}
		</header>

		{% block page %}
		<main id="auth-page">
			{% block content %}
			{% endblock %}
		</main>
		{% endblock %}
	</body>
</html>
