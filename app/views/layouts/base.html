<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width,initial-scale=1">
		{% block turbo_control %}
		<meta name="turbo-visit-control" content="reload">
		{% endblock %}
		{% block metadata %}{% endblock %}

		<title>{% block title %}Cork{% endblock %}</title>

		<link rel="stylesheet" type="text/css" href="/static/styles/prelude.css">
		<link rel="stylesheet" type="text/css" href="/static/styles/theme.css">
		<link rel="stylesheet" type="text/css" href="/static/styles/main.css">

		{% block scripts %}{% endblock %}
	</head>

	<body>
		{% block header %}
		<header id="site-header">
			<h1 id="site-title">Cork</h1>
		</header>
		{% endblock %}

		{% block page %}
		<main id="auth-page">
			{% block content %}
			{% endblock %}
		</main>
		{% endblock %}
	</body>
</html>
