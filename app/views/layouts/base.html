<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width,initial-scale=1">
		{{ sections.turbo_control }}

		<title>{{ sections.title or "Cork" }}</title>

		<link rel="icon" href="/favicon.ico">
		<link rel="icon" type="image/svg+xml" href="/favicon.svg">
		<link rel="icon" type="image/png" sizes="192x192" href="/favicon.png">
		<link rel="apple-touch-icon" sizes="180x180" href="/apple.png">

		{{ assets.style("main") }}

		{{ sections.scripts }}
	</head>

	<body>
		<header id="site-header">
			<svg id="site-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
				<rect width="100" height="100" rx="10" fill="var(--color-text, #111111)"/>
				<line x1="35" y1="67" x2="69" y2="27" stroke="var(--color-surface, #f1f1f1)" stroke-width="12" stroke-linecap="square"/>
				<rect x="20" y="52" width="30" height="30" rx="3" fill="var(--color-surface, #f1f1f1)"/>
				<rect x="58" y="16" width="22" height="22" rx="3" fill="var(--color-surface, #f1f1f1)"/>
			</svg>

			{{ sections.header }}
		</header>

		{{ content }}
	</body>
</html>
