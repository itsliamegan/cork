{% layout "layouts/base" %}

{% section "scripts" %}
{{ assets.script("main") }}
{% endsection %}

{% section "header" %}
<nav id="site-nav">
	<a
		class="site-nav-link {% if urls.route_is("boards.*") %} site-nav-link--active {% endif %}"
		href="{{ urls.route("boards.index") }}"
		>
		Boards
	</a>
	<a
		class="site-nav-link {% if urls.route_is("pins.*") %} site-nav-link--active {% endif %}"
		href="{{ urls.route("pins.index") }}"
		>
		Pins
	</a>
</nav>

<section id="site-actions">
	<span class="site-identity">{{ auth.user.name }}</span>
	<span class="site-action-separator">/</span>
	<a
		class="site-action {% if urls.route_is("settings.*", "invites.*", "recoveries.*") %} site-action--active {% endif %}"
		href="{{ urls.route("settings.show") }}"
		>
		Settings
	</a>
</section>
{% endsection %}

<main id="page">
	<header id="page-header">
		<h2 id="page-title">{{ sections.title }}</h2>
		{% if sections.actions %}
		<section id="page-actions">
			{{ sections.actions }}
		</section>
		{% endif %}
	</header>

	{{ content }}
</main>
