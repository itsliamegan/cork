{% layout "layouts/base" %}

{% section "scripts" %}
<script type="module" src="https://cdn.jsdelivr.net/npm/@hotwired/turbo@8.0"></script>
<script type="module" src="https://cdn.jsdelivr.net/npm/@hotwired/stimulus@3.2"></script>
<script type="module" src="/static/scripts/main.js"></script>
{% endsection %}

{% section "header" %}
<nav id="site-nav">
	<a
		class="site-nav-link {% if sections.nav == "boards" %} site-nav-link--active {% endif %}"
		href="{{ urls.route("boards.index") }}"
		>
		Boards
	</a>
	<a
		class="site-nav-link {% if sections.nav == "pins" %} site-nav-link--active {% endif %}"
		href="{{ urls.route("pins.index") }}"
		>
		Pins
	</a>
</nav>

<section id="site-actions">
	<span class="site-identity">{{ auth.user.name }}</span>
	<span class="site-action-separator">/</span>
	<a
		class="site-action {% if sections.nav == "settings" %} site-action--active {% endif %}"
		href="{{ urls.route("settings.show") }}"
		>
		Settings
	</a>
</section>
{% endsection %}

<main id="page">
	{{ content }}
</main>
