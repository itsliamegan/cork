{% extends "layouts.app" %} {% set active_nav = "pins" if originating_board is none else "boards" %} {% block title
%}Cork - New pin{% endblock %} {% block content %}
<header id="page-header">
	<h2 id="page-title">New pin</h2>
</header>

<form class="frame" method="POST" action="{{ urls.route("pins.create") }}" autocomplete="off">
	<input type="hidden" name="return_to" value="{{ submission.value("return_to", return_to) }}" />
	<header class="frame-header">
		<h3 class="frame-title">Details</h3>
	</header>

	<section class="form-items">
		<label class="frame-item form-item">
			<span class="form-label">Title</span>
			<input
				class="form-field{% if submission.invalid("title") %} form-field--invalid{% endif %}"
				type="text"
				name="title"
				value="{{ submission.value("title") }}"
				required
				autofocus
			>
			{% if submission.invalid("title") %}<span class="form-field-error">{{ submission.error("title") }}</span>{% endif %}
		</label>

		<label class="frame-item form-item">
			<span class="form-label">URL</span>
			<input
				class="form-field{% if submission.invalid("url") %} form-field--invalid{% endif %}"
				type="url"
				name="url"
				value="{{ submission.value("url") }}"
				required
			>
			{% if submission.invalid("url") %}<span class="form-field-error">{{ submission.error("url") }}</span>{% endif %}
		</label>

		<label class="frame-item form-item">
			<span class="form-label">Note</span>
			<textarea
				class="form-field pin-note-field"
				name="note"
				rows="6"
			>{{ submission.value("note") }}</textarea>
		</label>
	</section>

	{{ PinPlacements(options=placement_options, selected_board_ids=selected_board_ids) }}

	<footer class="frame-item form-actions">
		<a class="button" href="{{ return_to }}">Cancel</a>
		<button class="button button--action" type="submit">Save</button>
	</footer>
</form>
{% endblock %}
