<header class="frame-header">
	<h3 class="frame-title">Boards</h3>
</header>

<section class="pin-placements" data-controller="filter">
	<div class="pin-placements-search">
		<input
			class="form-field pin-placements-search-input"
			type="search"
			placeholder="Search"
			autocomplete="off"
			data-filter-target="query"
			data-action="input->filter#filter"
		>
	</div>
	<fieldset class="pin-placements-options">
		{% for board in boards %}
		{% set others = component.others(board) %}
		<label
			class="pin-placements-option"
			data-filter-target="item"
			data-filter-text="{{ board.title }}"
		>
			<input
				class="form-field"
				type="checkbox"
				name="board_ids"
				value="{{ board.id }}"
				{% if board.id|string in selected_board_ids %}checked{% endif %}
			>
			<span class="pin-placements-title">{{ board.title }}</span>
			<span class="pin-placements-state">
				{%- if others -%}
				Shared · {{ others | map(attribute="name") | sort | join(", ") }}
				{%- else -%}
				Private
				{%- endif -%}
			</span>
		</label>
		{% endfor %}
	</fieldset>
	<p class="pin-placements-empty" data-filter-target="empty" hidden>
		No matching boards.
	</p>
</section>
