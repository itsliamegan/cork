<header class="frame-header">
	<h3 class="frame-title">Boards</h3>
</header>

<section class="board-picker" data-controller="filter">
	<div class="board-picker-search">
		<input
			class="form-field board-picker-search-input"
			type="search"
			placeholder="Search"
			autocomplete="off"
			data-filter-target="query"
			data-action="input->filter#filter"
		>
	</div>
	<fieldset class="board-picker-options">
		{% for board_option in board_options %}
		<label
			class="board-picker-option"
			data-filter-target="item"
			data-filter-text="{{ board_option.board.title }}"
		>
			<input
				class="form-field"
				type="checkbox"
				name="board_id"
				value="{{ board_option.board.id }}"
				{% if board_option.board.id in selected_board_ids %}checked{% endif %}
			>
			<span class="board-picker-title">{{ board_option.board.title }}</span>
			<span class="board-picker-state">{{ board_option.sharing_label }}</span>
		</label>
		{% endfor %}
	</fieldset>
	<p class="board-picker-empty" data-filter-target="empty" hidden>
		No matching boards.
	</p>
</section>
