{% extends "layouts.base" %}
{% set active_nav = "boards" %}

{% block title %}Cork - Edit pin{% endblock %}

{% block content %}
<header id="page-header">
	<h2 id="page-title">Edit</h2>

	<span id="page-context">
		<span>Board:</span>
		<a href="/boards/{{ board.id }}">{{ board.title }}</a>
	</span>
</header>

<form class="frame" method="POST" action="/pins/{{ pin.id }}" autocomplete="off">
	<input type="text" name="_method" value="PUT" hidden>
	<input type="hidden" name="return_to" value="{{ return_to }}">

	<header class="frame-header">
		<h3 class="frame-title">Details</h3>
	</header>

	<section class="form-items">
		<label class="frame-item form-item">
			<span class="form-label">Title</span>
			<input
				class="form-field"
				type="text"
				name="title"
				value="{{ pin.title }}"
				required
				autofocus
			>
		</label>

		<label class="frame-item form-item">
			<span class="form-label">URL</span>
			<input class="form-field" type="url" name="url" value="{{ pin.url }}" required>
		</label>

		<label class="frame-item form-item">
			<span class="form-label">Board</span>
			<select class="form-field" name="board_id" required>
				{% for board in boards %}
				{% set selected = board.id | string == pin.board_id | string %}
				<option {% if selected %} selected {% endif %} value="{{ board.id }}">{{ board.title }}</option>
				{% endfor %}
			</select>
		</label>

		<label class="frame-item form-item">
			<span class="form-label">Note</span>
			<textarea class="form-field pin-note-field" name="note" rows="6">{{ pin.note }}</textarea>
		</label>
	</section>

	<footer class="frame-item form-actions">
		<a class="button" href="{{ return_to }}">Cancel</a>
		<button class="button button--action" type="submit">Save</button>
	</footer>
</form>
{% endblock %}
