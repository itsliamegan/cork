{% extends "layouts.app" %}
{% set active_nav = "boards" %}

{% block title %}Cork - Edit board{% endblock %}

{% block content %}
<header id="page-header">
	<h2 id="page-title">Edit board</h2>
</header>

<form class="frame" action="{{ urls.route("boards.update", {"id": board.id}) }}" method="POST" autocomplete="off">
	<input type="text" name="_method" value="PUT" hidden>
	<input type="hidden" name="return_to" value="{{ submission.value("return_to", return_to) }}">

	<header class="frame-header">
		<h3 class="frame-title">Details</h3>
	</header>

	<section class="form-items">
		<label class="frame-item form-item">
			<span class="form-label">Title</span>
			<input
				class="form-field{% if submission.invalid("title") %} form-field--invalid{% endif %}"
				type="text"
				name="title"
				value="{{ submission.value("title", board.title) }}"
				required
				autofocus
			>
			{% if submission.invalid("title") %}<span class="form-field-error">{{ submission.error("title") }}</span>{% endif %}
		</label>
	</section>

	{{ BoardSharing(
		owner=owner,
		users=users,
		shared_user_ids=shared_user_ids,
	) }}

	<footer class="frame-item form-actions">
		<a class="button" href="{{ return_to }}">Cancel</a>
		<button class="button button--action" type="submit">Save</button>
	</footer>
</form>
{% endblock %}
