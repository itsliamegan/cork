{% extends "layouts.base" %}
{% set active_nav = "settings" %}

{% block title %}Cork - Settings{% endblock %}

{% block content %}
<header id="page-header">
	<h2 id="page-title">Settings</h2>
</header>

<div class="frame">
	<header class="frame-header">
		<h3 class="frame-title">Account</h3>
	</header>

	<div class="frame-item setting-item">
		<span class="setting-label">Signed in as</span>
		<span class="setting-value">{{ current_user.name }}</span>
	</div>

	<header class="frame-header">
		<h3 class="frame-title">Session</h3>
	</header>

	<form class="frame-item setting-item" action="/sign-out" method="POST" data-turbo="false">
		<span class="setting-label">This browser</span>
		<span class="setting-note">Return to the user chooser.</span>
		<button class="button" type="submit">Sign out</button>
	</form>

	<header class="frame-header">
		<h3 class="frame-title">Preferences</h3>
	</header>

	<form action="/settings" method="POST">
		<input type="text" name="_method" value="PUT" hidden>
		<input type="hidden" name="return_to" value="{{ return_to }}">
		<label class="frame-item setting-option">
			<input
				class="form-field"
				type="checkbox"
				name="open_in_new_tab"
				{% if current_user.open_in_new_tab %}checked{% endif %}
			>
			<span class="setting-name">
				<strong>Open pin links in a new tab</strong>
				<span class="setting-note">Open saved external URLs in a separate browser tab.</span>
			</span>
		</label>
		<footer class="frame-item form-actions">
			<button class="button button--action" type="submit">Save</button>
		</footer>
	</form>
</div>
{% endblock %}
