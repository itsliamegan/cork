<dialog id="{{ name }}-dialog" class="dialog">
	<section class="dialog-content">
		<p>{{ content }}</p>
	</section>
	<footer class="dialog-actions">
		<button class="button" command="close" commandfor="{{ name }}-dialog">Cancel</button>
		<button class="button button--danger" type="submit" form="{{ name }}-form">{{ confirm }}</button>
		<form id="{{ name }}-form" action="{{ action }}" method="POST" hidden>
			{% if method %}<input type="text" name="_method" value="{{ method }}" hidden>{% endif %}
		</form>
	</footer>
</dialog>
